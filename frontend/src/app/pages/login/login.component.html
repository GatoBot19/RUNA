<div class="flex h-screen w-full bg-white font-sans">
  
  <!-- LADO IZQUIERDO: Panel Azul (Logo y Eslogan) -->
  <div class="hidden lg:flex flex-col items-center justify-center w-1/2 bg-[#D9F0FF]">
    <div class="text-center">
      <h1 class="text-5xl font-black text-[#0B3D91] tracking-wider mb-2">RUNA</h1>
      <div class="w-48 h-48 mx-auto bg-[#0B3D91] rounded-full flex items-center justify-center mb-6">
        <span class="text-white text-xl">Logo Provisional</span>
      </div>
      <p class="text-[#0B3D91] font-medium text-lg">"Inteligencia para tu negocio rural"</p>
    </div>
  </div>

  <!-- LADO DERECHO: Formulario de Login -->
  <div class="flex flex-col items-center justify-center w-full lg:w-1/2 p-10">
    <div class="w-full max-w-md">
      
      <h2 class="text-3xl font-bold text-gray-800 text-center mb-2">Bienvenido</h2>
      <p class="text-gray-500 text-center mb-8">Inicia sesión para continuar</p>

      <!-- Mensaje de error -->
      @if (errorMessage) {
        <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-4 text-sm flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
          </svg>
          {{ errorMessage }}
        </div>
      }

      <form (ngSubmit)="onSubmit()" class="space-y-6">
        
        <!-- Input Email -->
        <div>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
              </svg>
            </span>
            <input type="email" placeholder="Email" 
              [(ngModel)]="email" name="email" required
              class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
          </div>
        </div>

        <!-- Input Contraseña -->
        <div>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd" />
              </svg>
            </span>
            <input type="password" placeholder="Contraseña" 
              [(ngModel)]="password" name="password" required
              class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
          </div>
        </div>

        <!-- Opciones extras -->
        <div class="flex items-center justify-between text-sm">
          <label class="flex items-center text-gray-600 cursor-pointer">
            <input type="checkbox" class="mr-2 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
            Recordarme
          </label>
          <a href="#" class="text-blue-500 hover:text-blue-700 hover:underline">¿Olvidaste tu contraseña?</a>
        </div>

        <!-- Botón Iniciar Sesión -->
        <button type="submit" [disabled]="loading || !email || !password"
          class="w-full bg-[#2F80ED] hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-colors shadow-md disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
          @if (loading) {
            <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Ingresando...
          } @else {
            Iniciar sesión
          }
        </button>

      </form>
    </div>
  </div>
</div>
