<div class="flex h-screen w-full bg-white font-sans">
  
  <!-- LADO IZQUIERDO: Logo -->
  <div class="hidden lg:flex flex-col items-center justify-center w-1/2 bg-white overflow-hidden px-8">
    <img src="RUNA_logo.jpeg" alt="RUNA Logo" class="w-[34rem] h-auto flex-shrink-0">
  </div>

  <!-- LADO DERECHO: Formulario de Login -->
  <div class="relative flex flex-col items-center justify-center w-full lg:w-1/2 p-10 bg-gradient-to-br from-[#D9F0FF] via-[#E8E0FF] to-[#D9F0FF] overflow-hidden">

    <!-- Burbujas decorativas de fondo -->
    <div class="absolute top-[-80px] right-[-60px] w-72 h-72 rounded-full bg-gradient-to-br from-purple-300/40 to-blue-300/30 blur-3xl"></div>
    <div class="absolute bottom-[-100px] left-[-80px] w-96 h-96 rounded-full bg-gradient-to-tr from-blue-300/30 to-cyan-200/40 blur-3xl"></div>
    <div class="absolute top-1/2 left-1/3 w-48 h-48 rounded-full bg-gradient-to-br from-violet-300/20 to-indigo-200/20 blur-2xl"></div>

    <!-- Tarjeta Liquid Glass -->
    <div class="relative w-full max-w-md backdrop-blur-2xl bg-white/20 border border-white/50 rounded-[2rem] p-10
                shadow-[inset_0_1px_1px_rgba(255,255,255,0.6),inset_0_-1px_1px_rgba(255,255,255,0.1),0_20px_60px_rgba(100,80,180,0.12),0_2px_8px_rgba(0,0,0,0.04)]
                before:absolute before:inset-0 before:rounded-[2rem] before:bg-gradient-to-b before:from-white/30 before:to-transparent before:pointer-events-none before:h-1/2">
      
      <h2 class="relative text-3xl font-bold text-gray-800 text-center mb-2">Bienvenido</h2>
      <p class="relative text-gray-500 text-center mb-8">Inicia sesión para continuar</p>

      <!-- Mensaje de error -->
      @if (errorMessage) {
        <div class="relative bg-red-100/40 border border-red-300/40 text-red-700 px-4 py-3 rounded-2xl mb-4 text-sm flex items-center gap-2 backdrop-blur-md">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
          </svg>
          {{ errorMessage }}
        </div>
      }

      <form (ngSubmit)="onSubmit()" class="relative space-y-6">
        
        <!-- Input Email -->
        <div>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
              </svg>
            </span>
            <input type="email" placeholder="Email" 
              [(ngModel)]="email" name="email" required
              class="w-full pl-10 pr-4 py-3 bg-white/30 border border-white/50 rounded-2xl focus:outline-none focus:ring-2 focus:ring-purple-400/50 focus:border-transparent transition-all backdrop-blur-md placeholder-gray-400 shadow-[inset_0_1px_2px_rgba(255,255,255,0.5)]">
          </div>
        </div>

        <!-- Input Contraseña -->
        <div>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd" />
              </svg>
            </span>
            <input type="password" placeholder="Contraseña" 
              [(ngModel)]="password" name="password" required
              class="w-full pl-10 pr-4 py-3 bg-white/30 border border-white/50 rounded-2xl focus:outline-none focus:ring-2 focus:ring-purple-400/50 focus:border-transparent transition-all backdrop-blur-md placeholder-gray-400 shadow-[inset_0_1px_2px_rgba(255,255,255,0.5)]">
          </div>
        </div>

        <!-- Opciones extras -->
        <div class="flex items-center justify-between text-sm">
          <label class="flex items-center text-gray-600 cursor-pointer">
            <input type="checkbox" class="mr-2 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
            Recordarme
          </label>
          <a href="#" class="text-indigo-600 hover:text-indigo-800 hover:underline font-medium">¿Olvidaste tu contraseña?</a>
        </div>

        <!-- Botón Iniciar Sesión -->
        <button type="submit" [disabled]="loading || !email || !password"
          class="w-full bg-gradient-to-r from-[#7B5EA7] to-[#2F80ED] hover:from-[#6A4F94] hover:to-[#2570D4] text-white font-bold py-3.5 px-4 rounded-2xl transition-all shadow-[0_8px_24px_rgba(100,60,180,0.3)] disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
          @if (loading) {
            <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Ingresando...
          } @else {
            Iniciar sesión
          }
        </button>

      </form>
    </div>

  </div>
</div>
