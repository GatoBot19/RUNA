<div class="flex h-screen bg-gradient-to-br from-[#D9F0FF] via-[#E8E0FF] to-[#D9F0FF] relative overflow-hidden">

  <!-- Burbujas decorativas globales -->
  <div class="fixed top-[-120px] right-[20%] w-96 h-96 rounded-full bg-gradient-to-br from-purple-300/20 to-blue-300/15 blur-3xl pointer-events-none"></div>
  <div class="fixed bottom-[-100px] left-[10%] w-[30rem] h-[30rem] rounded-full bg-gradient-to-tr from-blue-300/15 to-cyan-200/20 blur-3xl pointer-events-none"></div>
  <div class="fixed top-[40%] right-[5%] w-64 h-64 rounded-full bg-gradient-to-br from-violet-300/15 to-indigo-200/15 blur-3xl pointer-events-none"></div>

  <!-- Backdrop para oscurecer en Móvil / Tablet cuando el menú está abierto -->
  @if (sidebarOpen()) {
    <div (click)="closeSidebar()" 
         class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40 lg:hidden transition-opacity"></div>
  }

  <!-- ============================== -->
  <!-- SIDEBAR (Responsivo Móvil/Desktop) -->
  <!-- ============================== -->
  <aside class="fixed lg:static inset-y-0 left-0 z-50 w-64 backdrop-blur-2xl bg-white/90 lg:bg-white/25 border-r border-white/40 text-slate-900 flex flex-col flex-shrink-0 shadow-[4px_0_24px_rgba(100,80,180,0.12)] transition-transform duration-300 ease-in-out"
         [class.-translate-x-full]="!sidebarOpen()"
         [class.translate-x-0]="sidebarOpen()"
         [class.lg:translate-x-0]="true">

    <!-- Header del Sidebar / Logo -->
    <div class="flex items-center justify-between pt-5 pb-3 px-4 relative">
      <div class="flex flex-col items-center flex-1">
        <img src="RUNA_Recorte.png" alt="RUNA Logo" class="w-16 h-16 sm:w-20 sm:h-20 drop-shadow-md mb-1.5">
        <h2 class="text-xl font-black text-blue-900 tracking-wide">RUNA</h2>
        <p class="text-[10px] text-blue-800 font-medium text-center mt-0.5">Gestión Inteligente</p>
      </div>

      <!-- Botón cerrar (Solo Móvil / Tablet) -->
      <button (click)="closeSidebar()" 
              class="lg:hidden absolute top-4 right-3 p-1.5 rounded-xl bg-white/60 hover:bg-white text-slate-700 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Navegación -->
    <nav class="flex-1 py-2 px-3 sm:px-4 space-y-1 overflow-y-auto">

      <a routerLink="/dashboard" (click)="closeSidebar()" routerLinkActive="!bg-gradient-to-r !from-[#7B5EA7] !to-[#2F80ED] !text-white shadow-[0_4px_16px_rgba(100,60,180,0.3)]"
         class="flex items-center gap-3 px-4 py-2.5 sm:py-3 rounded-2xl text-slate-800 hover:bg-white/30 transition-all text-sm font-bold">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25a2.25 2.25 0 0 1-2.25-2.25v-2.25Z" />
        </svg>
        <span>Dashboard</span>
      </a>

      <a routerLink="/productos" (click)="closeSidebar()" routerLinkActive="!bg-gradient-to-r !from-[#7B5EA7] !to-[#2F80ED] !text-white shadow-[0_4px_16px_rgba(100,60,180,0.3)]"
         class="flex items-center gap-3 px-4 py-2.5 sm:py-3 rounded-2xl text-slate-800 hover:bg-white/30 transition-all text-sm font-bold">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="m21 7.5-9-5.25L3 7.5m18 0-9 5.25m9-5.25v9l-9 5.25M3 7.5l9 5.25M3 7.5v9l9 5.25m0-9v9" />
        </svg>
        <span>Productos</span>
      </a>

      <a routerLink="/categorias" (click)="closeSidebar()" routerLinkActive="!bg-gradient-to-r !from-[#7B5EA7] !to-[#2F80ED] !text-white shadow-[0_4px_16px_rgba(100,60,180,0.3)]"
         class="flex items-center gap-3 px-4 py-2.5 sm:py-3 rounded-2xl text-slate-800 hover:bg-white/30 transition-all text-sm font-bold">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.568 3H5.25A2.25 2.25 0 0 0 3 5.25v4.318c0 .597.237 1.17.659 1.591l9.581 9.581c.699.699 1.78.872 2.607.33a18.095 18.095 0 0 0 5.223-5.223c.542-.827.369-1.908-.33-2.607L11.16 3.66A2.25 2.25 0 0 0 9.568 3Z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 6h.008v.008H6V6Z" />
        </svg>
        <span>Categorías</span>
      </a>

      <a routerLink="/clientes" (click)="closeSidebar()" routerLinkActive="!bg-gradient-to-r !from-[#7B5EA7] !to-[#2F80ED] !text-white shadow-[0_4px_16px_rgba(100,60,180,0.3)]"
         class="flex items-center gap-3 px-4 py-2.5 sm:py-3 rounded-2xl text-slate-800 hover:bg-white/30 transition-all text-sm font-bold">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z" />
        </svg>
        <span>Clientes</span>
      </a>

      <a routerLink="/ventas" (click)="closeSidebar()" routerLinkActive="!bg-gradient-to-r !from-[#7B5EA7] !to-[#2F80ED] !text-white shadow-[0_4px_16px_rgba(100,60,180,0.3)]"
         class="flex items-center gap-3 px-4 py-2.5 sm:py-3 rounded-2xl text-slate-800 hover:bg-white/30 transition-all text-sm font-bold">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" />
        </svg>
        <span>Ventas</span>
      </a>

      <a routerLink="/pedidos" (click)="closeSidebar()" routerLinkActive="!bg-gradient-to-r !from-[#7B5EA7] !to-[#2F80ED] !text-white shadow-[0_4px_16px_rgba(100,60,180,0.3)]"
         class="flex items-center gap-3 px-4 py-2.5 sm:py-3 rounded-2xl text-slate-800 hover:bg-white/30 transition-all text-sm font-bold">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15a2.25 2.25 0 0 1 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25ZM6.75 12h.008v.008H6.75V12Zm0 3h.008v.008H6.75V15Zm0 3h.008v.008H6.75V18Z" />
        </svg>
        <span>Pedidos</span>
      </a>

      <a routerLink="/inventario" (click)="closeSidebar()" routerLinkActive="!bg-gradient-to-r !from-[#7B5EA7] !to-[#2F80ED] !text-white shadow-[0_4px_16px_rgba(100,60,180,0.3)]"
         class="flex items-center gap-3 px-4 py-2.5 sm:py-3 rounded-2xl text-slate-800 hover:bg-white/30 transition-all text-sm font-bold">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="m20.25 7.5-.625 10.632a2.25 2.25 0 0 1-2.247 2.118H6.622a2.25 2.25 0 0 1-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125Z" />
        </svg>
        <span>Inventario</span>
      </a>

      <a routerLink="/proveedores" (click)="closeSidebar()" routerLinkActive="!bg-gradient-to-r !from-[#7B5EA7] !to-[#2F80ED] !text-white shadow-[0_4px_16px_rgba(100,60,180,0.3)]"
         class="flex items-center gap-3 px-4 py-2.5 sm:py-3 rounded-2xl text-slate-800 hover:bg-white/30 transition-all text-sm font-bold">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 18.75a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 0 1-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m3 0h1.125c.621 0 1.129-.504 1.09-1.124a17.902 17.902 0 0 0-3.213-9.193 2.056 2.056 0 0 0-1.58-.86H14.25M16.5 18.75h-2.25m0-11.177v-.958c0-.568-.422-1.048-.987-1.106a48.554 48.554 0 0 0-10.026 0 1.106 1.106 0 0 0-.987 1.106v7.635m12-6.677v6.677m0 4.5v-4.5m0 0h-12" />
        </svg>
        <span>Proveedores</span>
      </a>

      <a routerLink="/reportes" (click)="closeSidebar()" routerLinkActive="!bg-gradient-to-r !from-[#7B5EA7] !to-[#2F80ED] !text-white shadow-[0_4px_16px_rgba(100,60,180,0.3)]"
         class="flex items-center gap-3 px-4 py-2.5 sm:py-3 rounded-2xl text-slate-800 hover:bg-white/30 transition-all text-sm font-bold">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z" />
        </svg>
        <span>Reportes</span>
      </a>

      <a routerLink="/usuarios" (click)="closeSidebar()" routerLinkActive="!bg-gradient-to-r !from-[#7B5EA7] !to-[#2F80ED] !text-white shadow-[0_4px_16px_rgba(100,60,180,0.3)]"
         class="flex items-center gap-3 px-4 py-2.5 sm:py-3 rounded-2xl text-slate-800 hover:bg-white/30 transition-all text-sm font-bold">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
        </svg>
        <span>Usuarios</span>
      </a>

      <a routerLink="/configuracion" (click)="closeSidebar()" routerLinkActive="!bg-gradient-to-r !from-[#7B5EA7] !to-[#2F80ED] !text-white shadow-[0_4px_16px_rgba(100,60,180,0.3)]"
         class="flex items-center gap-3 px-4 py-2.5 sm:py-3 rounded-2xl text-slate-800 hover:bg-white/30 transition-all text-sm font-bold">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
        </svg>
        <span>Configuración</span>
      </a>

    </nav>

    <!-- Cerrar sesión -->
    <div class="p-4 sm:p-5">
      <button (click)="logout()"
         class="w-full flex items-center justify-center gap-3 px-4 py-2.5 backdrop-blur-md bg-white/40 border border-white/50 rounded-2xl text-[#7B5EA7] shadow-[0_2px_8px_rgba(100,60,180,0.1)] hover:bg-white/60 transition-all text-sm font-bold">
        <span>Cerrar sesión</span>
      </button>
    </div>

  </aside>

  <!-- ============================== -->
  <!-- CONTENIDO PRINCIPAL            -->
  <!-- ============================== -->
  <div class="flex-1 flex flex-col overflow-hidden w-full">

    <!-- Top Bar Responsivo -->
    <header class="bg-transparent h-16 sm:h-20 flex items-center justify-between px-4 sm:px-6 lg:px-8 flex-shrink-0">
      
      <!-- Lado Izquierdo: Botón Menú Hamburguesa (Móvil) + Logo Móvil + Buscador -->
      <div class="flex items-center gap-3">
        <!-- Botón Menú Hamburguesa (Móvil/Tablet) -->
        <button (click)="toggleSidebar()" 
                class="lg:hidden p-2 rounded-2xl backdrop-blur-md bg-white/40 border border-white/50 text-slate-800 hover:bg-white/60 transition-all shadow-sm">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
          </svg>
        </button>

        <!-- Brand logo para móvil -->
        <div class="lg:hidden flex items-center gap-2">
          <img src="RUNA_Recorte.png" alt="RUNA" class="w-7 h-7 drop-shadow-sm">
          <span class="text-base font-black text-blue-900 tracking-wide">RUNA</span>
        </div>

        <!-- Buscador (Oculto en pantallas muy pequeñas, visible desde sm) -->
        <div class="relative hidden sm:block">
          <input type="text" placeholder="Buscar..."
                 class="pl-4 pr-10 py-2 sm:py-2.5 backdrop-blur-md bg-white/30 border border-white/50 rounded-2xl focus:outline-none focus:ring-2 focus:ring-purple-400/50 focus:border-transparent w-48 md:w-64 lg:w-80 text-sm shadow-[inset_0_1px_2px_rgba(255,255,255,0.5)] placeholder-gray-400">
        </div>
      </div>

      <!-- Usuario y Acciones -->
      <div class="flex items-center gap-3 sm:gap-6">
        <!-- Notificaciones -->
        <button class="relative p-2 text-slate-800 hover:text-black transition-colors rounded-xl hover:bg-white/30">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 sm:w-6 sm:h-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0" />
          </svg>
        </button>

        <!-- Perfil -->
        <div class="flex items-center gap-2 sm:gap-3">
          <div class="w-9 h-9 sm:w-10 sm:h-10 backdrop-blur-md bg-white/40 border border-white/50 rounded-full flex items-center justify-center shadow-sm">
            <span class="text-[#7B5EA7] text-xs sm:text-sm font-bold">{{ userInitial() }}</span>
          </div>
          <div class="hidden sm:block">
            <p class="text-sm font-black text-slate-900 leading-tight">{{ userName() }}</p>
            <p class="text-[11px] text-slate-500 uppercase font-semibold">{{ userRole() }}</p>
          </div>
        </div>
      </div>
    </header>

    <!-- Contenido de la página -->
    <main class="flex-1 overflow-y-auto px-4 sm:px-6 lg:px-8 pb-6 sm:pb-8">
      <router-outlet />
    </main>

  </div>
</div>
